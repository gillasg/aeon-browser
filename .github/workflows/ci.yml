name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      # browser-crawl and the Browser Use Extension, next to this checkout.
      - name: Set up linked repos
        run: node scripts/link-repos.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Cache Chrome for Testing
        uses: actions/cache@v4
        with:
          path: .slice0-audit/chrome-for-testing-154.0.8037.57
          key: chrome-for-testing-154.0.8037.57-win64
      - name: Install Chrome for Testing
        shell: pwsh
        run: |
          $dir = ".slice0-audit/chrome-for-testing-154.0.8037.57"
          if (-not (Test-Path "$dir/chrome-win64/chrome.exe")) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            Invoke-WebRequest "https://storage.googleapis.com/chrome-for-testing-public/154.0.8037.57/win64/chrome-win64.zip" -OutFile "$dir/chrome-win64.zip"
            Expand-Archive "$dir/chrome-win64.zip" -DestinationPath $dir -Force
          }
      - run: pnpm check
