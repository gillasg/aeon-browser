name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Decides whether a pull request touches anything but prose. Pure docs PRs (README, docs/,
  # store/*.md) skip the Node and Chrome lanes; agent text under browser/docs/agent/ is code.
  # A push to main always runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          printf '%s\n' "$files"
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              browser/docs/agent/*) code=true ;;
              README.md | docs/* | store/*.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # OS-independent static checks run once, on Linux, concurrently after one build.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Format, lint, artifact gate (parallel)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/static"
          checks=(
            "pnpm --dir browser run format:check"
            "pnpm --dir browser run lint"
            "pnpm format:check"
            "pnpm lint"
            "pnpm test:artifact-gate"
          )
          pids=()
          for i in "${!checks[@]}"; do
            bash -c "${checks[$i]}" > "$RUNNER_TEMP/static/$i.log" 2>&1 &
            pids+=($!)
          done
          failed=0
          for i in "${!checks[@]}"; do
            if wait "${pids[$i]}"; then status=ok; else status=FAILED; failed=1; fi
            echo "::group::${checks[$i]} ($status)"
            cat "$RUNNER_TEMP/static/$i.log"
            echo "::endgroup::"
            [ "$status" = FAILED ] && echo "::error::${checks[$i]} failed"
          done
          exit "$failed"
      - name: Typecheck and agent text
        run: |
          pnpm --dir browser run typecheck
          pnpm typecheck
          pnpm agent-text:check

  # The fast lane (no browser) on every OS Graft ships to, built once.
  unit:
    name: unit (${{ matrix.os }}, ${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
        suite: [browser, root]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Browser unit tests
        if: matrix.suite == 'browser'
        run: pnpm --dir browser run test
      - name: Root unit tests
        if: matrix.suite == 'root'
        run: pnpm test
      # The Claw & Primitive contract: deterministic, zero-LLM, loopback-only, Node alone (no
      # Chrome, no model calls), on every OS Graft ships to.
      - name: Claw & Primitive contract
        if: matrix.suite == 'root'
        run: pnpm test:claws
      # On main the Mac session reuses these built outputs instead of rebuilding from scratch.
      # The paths mirror the pnpm workspace build outputs; name carries the commit so the session
      # only restores it when its own commit matches.
      - name: Upload macOS build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'macOS' && matrix.suite == 'root' && success()
        uses: actions/upload-artifact@v4
        with:
          name: graft-macos-build-${{ github.sha }}
          path: |
            apps/daemon/dist
            apps/cli/dist
            packages/domain/dist
            packages/location/dist
            packages/protocol/dist
            packages/store/dist
            packages/pi-adapter/dist
            packages/ui/dist
            browser/apps/bridge/dist
            browser/packages/protocol/dist
            browser/packages/credentials/dist
            browser/packages/site-mapper/dist
            browser/packages/crawl/dist
            browser/packages/tools/dist
            browser/packages/cdp/dist
            browser/packages/engine/dist
            apps/chrome-extension/native-dist
          if-no-files-found: error
          retention-days: 7

  # The real-Chrome lane, sharded per OS. Each OS covers every browser test file across its
  # shards (`split`), plus one shard for the canary, package, root browser tests and sweeps.
  browser-e2e:
    name: browser-e2e (${{ matrix.os }}, shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            chrome-platform: linux64
            chrome-binary: chrome-linux64/chrome
            shard: 1
            split: "1/3"
            canary: false
            package: false
            sweeps: false
          - os: ubuntu-latest
            chrome-platform: linux64
            chrome-binary: chrome-linux64/chrome
            shard: 2
            split: "2/3"
            canary: false
            package: false
            sweeps: false
          - os: ubuntu-latest
            chrome-platform: linux64
            chrome-binary: chrome-linux64/chrome
            shard: 3
            split: "3/3"
            canary: false
            package: false
            sweeps: false
          - os: ubuntu-latest
            chrome-platform: linux64
            chrome-binary: chrome-linux64/chrome
            shard: 4
            split: ""
            canary: true
            package: true
            sweeps: true
          - os: windows-latest
            chrome-platform: win64
            chrome-binary: chrome-win64/chrome.exe
            shard: 1
            split: "1/3"
            canary: false
            package: false
            sweeps: false
          - os: windows-latest
            chrome-platform: win64
            chrome-binary: chrome-win64/chrome.exe
            shard: 2
            split: "2/3"
            canary: false
            package: false
            sweeps: false
          - os: windows-latest
            chrome-platform: win64
            chrome-binary: chrome-win64/chrome.exe
            shard: 3
            split: "3/3"
            canary: false
            package: false
            sweeps: false
          - os: windows-latest
            chrome-platform: win64
            chrome-binary: chrome-win64/chrome.exe
            shard: 4
            split: ""
            canary: true
            package: true
            sweeps: true
          - os: macos-26
            chrome-platform: mac-arm64
            chrome-binary: chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing
            shard: 1
            split: "1/3"
            canary: false
            package: false
            sweeps: false
          - os: macos-26
            chrome-platform: mac-arm64
            chrome-binary: chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing
            shard: 2
            split: "2/3"
            canary: false
            package: false
            sweeps: false
          - os: macos-26
            chrome-platform: mac-arm64
            chrome-binary: chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing
            shard: 3
            split: "3/3"
            canary: false
            package: false
            sweeps: false
          - os: macos-26
            chrome-platform: mac-arm64
            chrome-binary: chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing
            shard: 4
            split: ""
            canary: true
            package: true
            sweeps: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Cache Chrome for Testing
        uses: actions/cache@v4
        with:
          path: .slice0-audit/chrome-for-testing-157.0.8103.78
          key: chrome-for-testing-157.0.8103.78-${{ matrix.chrome-platform }}
      - name: Install Chrome for Testing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = ".slice0-audit/chrome-for-testing-157.0.8103.78"
          $bin = "$dir/${{ matrix.chrome-binary }}"
          if (-not (Test-Path -LiteralPath $bin)) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            $zip = Join-Path $dir "chrome.zip"
            Invoke-WebRequest "https://storage.googleapis.com/chrome-for-testing-public/157.0.8103.78/${{ matrix.chrome-platform }}/chrome-${{ matrix.chrome-platform }}.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath $dir -Force
            Remove-Item $zip
          }
      - name: Install Chrome for Testing
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dir=".slice0-audit/chrome-for-testing-157.0.8103.78"
          bin="$dir/${{ matrix.chrome-binary }}"
          if [ ! -f "$bin" ]; then
            mkdir -p "$dir"
            curl -fsSL "https://storage.googleapis.com/chrome-for-testing-public/157.0.8103.78/${{ matrix.chrome-platform }}/chrome-${{ matrix.chrome-platform }}.zip" -o "$dir/chrome.zip"
            unzip -q "$dir/chrome.zip" -d "$dir"
            rm -f "$dir/chrome.zip"
          fi
          chmod +x "$bin"
          if [ "${{ runner.os }}" = "macOS" ]; then
            xattr -dr com.apple.quarantine "$dir/chrome-mac-arm64/Google Chrome for Testing.app" || true
          fi
      - name: Install Chrome shared libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deps=".slice0-audit/chrome-for-testing-157.0.8103.78/chrome-linux64/deb.deps"
          # One resolver pass for every dependency instead of one apt run per line.
          wanted=()
          while IFS= read -r pkg || [ -n "$pkg" ]; do
            pkg="${pkg%%#*}"
            pkg="$(printf '%s' "$pkg" | xargs)"
            [ -n "$pkg" ] && wanted+=("$pkg")
          done < "$deps"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          sudo apt-get satisfy -y --no-install-recommends "${wanted[@]}"
      - run: pnpm build
      - name: Canary
        if: matrix.canary && runner.os != 'Linux'
        working-directory: browser
        run: node --test test/canary.e2e.test.mjs
        env:
          CHROME_PATH: ${{ github.workspace }}/.slice0-audit/chrome-for-testing-157.0.8103.78/${{ matrix.chrome-binary }}
          REQUIRE_E2E: "1"
      - name: Canary
        if: matrix.canary && runner.os == 'Linux'
        working-directory: browser
        run: xvfb-run -a node --test test/canary.e2e.test.mjs
        env:
          CHROME_PATH: ${{ github.workspace }}/.slice0-audit/chrome-for-testing-157.0.8103.78/${{ matrix.chrome-binary }}
          REQUIRE_E2E: "1"
      - name: Browser tests (shard ${{ matrix.split }})
        if: matrix.split != '' && runner.os != 'Linux'
        working-directory: browser
        run: node scripts/run-tests.mjs --browser "test/*.test.mjs" --shard=${{ matrix.split }}
        env:
          CHROME_PATH: ${{ github.workspace }}/.slice0-audit/chrome-for-testing-157.0.8103.78/${{ matrix.chrome-binary }}
      - name: Browser tests (shard ${{ matrix.split }})
        if: matrix.split != '' && runner.os == 'Linux'
        working-directory: browser
        run: xvfb-run -a node scripts/run-tests.mjs --browser "test/*.test.mjs" --shard=${{ matrix.split }}
        env:
          CHROME_PATH: ${{ github.workspace }}/.slice0-audit/chrome-for-testing-157.0.8103.78/${{ matrix.chrome-binary }}
      - name: Package e2e
        if: matrix.package && runner.os != 'Linux'
        run: node browser/scripts/package-e2e.mjs
        env:
          CHROME_PATH: ${{ github.workspace }}/.slice0-audit/chrome-for-testing-157.0.8103.78/${{ matrix.chrome-binary }}
      - name: Package e2e
        if: matrix.package && runner.os == 'Linux'
        run: xvfb-run -a node browser/scripts/package-e2e.mjs
        env:
          CHROME_PATH: ${{ github.workspace }}/.slice0-audit/chrome-for-testing-157.0.8103.78/${{ matrix.chrome-binary }}
      - name: Root browser tests
        if: matrix.package && runner.os != 'Linux'
        run: pnpm test:browser
        env:
          CHROME_PATH: ${{ github.workspace }}/.slice0-audit/chrome-for-testing-157.0.8103.78/${{ matrix.chrome-binary }}
      - name: Root browser tests
        if: matrix.package && runner.os == 'Linux'
        run: xvfb-run -a pnpm test:browser
        env:
          CHROME_PATH: ${{ github.workspace }}/.slice0-audit/chrome-for-testing-157.0.8103.78/${{ matrix.chrome-binary }}
      # The real-Chrome conformance sweep: Graft's engine through the built bridge and extension
      # against the two-origin fixture site, judged against golden transcripts and pinned
      # divergences. A missing Chrome fails it. Windows reports without blocking until it has a
      # run of green builds.
      - name: Conformance sweep
        if: matrix.sweeps && runner.os == 'macOS'
        run: pnpm test:conformance
        env:
          CHROME_PATH: ${{ github.workspace }}/.slice0-audit/chrome-for-testing-157.0.8103.78/${{ matrix.chrome-binary }}
          GRAFT_CONFORMANCE_REQUIRE: chrome
          GRAFT_CONFORMANCE_OUT: ${{ github.workspace }}/conformance-output
      - name: Conformance sweep
        if: matrix.sweeps && runner.os == 'Linux'
        run: xvfb-run -a pnpm test:conformance
        env:
          CHROME_PATH: ${{ github.workspace }}/.slice0-audit/chrome-for-testing-157.0.8103.78/${{ matrix.chrome-binary }}
          GRAFT_CONFORMANCE_REQUIRE: chrome
          GRAFT_CONFORMANCE_OUT: ${{ github.workspace }}/conformance-output
      - name: Conformance sweep (informational)
        if: matrix.sweeps && runner.os == 'Windows'
        continue-on-error: true
        run: pnpm test:conformance
        env:
          CHROME_PATH: ${{ github.workspace }}/.slice0-audit/chrome-for-testing-157.0.8103.78/${{ matrix.chrome-binary }}
          GRAFT_CONFORMANCE_REQUIRE: chrome
          GRAFT_CONFORMANCE_OUT: ${{ github.workspace }}/conformance-output
      - name: Keep conformance output
        if: always() && matrix.sweeps
        uses: actions/upload-artifact@v4
        with:
          name: conformance-output-${{ matrix.os }}
          path: conformance-output
          if-no-files-found: ignore
          retention-days: 7
      - name: Stealth probe
        if: matrix.sweeps && runner.os == 'macOS'
        run: pnpm test:stealth-probe
        env:
          CHROME_PATH: ${{ github.workspace }}/.slice0-audit/chrome-for-testing-157.0.8103.78/${{ matrix.chrome-binary }}
          GRAFT_STEALTH_REQUIRE: chrome
          GRAFT_STEALTH_PROBE_OUT: ${{ github.workspace }}/stealth-probe-output/report.json
      - name: Stealth probe
        if: matrix.sweeps && runner.os == 'Linux'
        run: xvfb-run -a pnpm test:stealth-probe
        env:
          CHROME_PATH: ${{ github.workspace }}/.slice0-audit/chrome-for-testing-157.0.8103.78/${{ matrix.chrome-binary }}
          GRAFT_STEALTH_REQUIRE: chrome
          GRAFT_STEALTH_PROBE_OUT: ${{ github.workspace }}/stealth-probe-output/report.json
      - name: Stealth probe (informational)
        if: matrix.sweeps && runner.os == 'Windows'
        continue-on-error: true
        run: pnpm test:stealth-probe
        env:
          CHROME_PATH: ${{ github.workspace }}/.slice0-audit/chrome-for-testing-157.0.8103.78/${{ matrix.chrome-binary }}
          GRAFT_STEALTH_REQUIRE: chrome
          GRAFT_STEALTH_PROBE_OUT: ${{ github.workspace }}/stealth-probe-output/report.json
      - name: Keep stealth probe output
        if: always() && matrix.sweeps
        uses: actions/upload-artifact@v4
        with:
          name: stealth-probe-output-${{ matrix.os }}
          path: stealth-probe-output
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep browser test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-output-${{ matrix.os }}-${{ matrix.shard }}
          path: browser/test-output
          if-no-files-found: ignore
          retention-days: 7
