name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      # The Browser Use Extension (its protocol and tools) and pi-ai-login, next to this checkout.
      - name: Set up linked repos
        run: node scripts/link-repos.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
